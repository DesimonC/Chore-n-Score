<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chore-n-Score | DesK Apps</title><style>body{font:16px system-ui;background:#edf6f5;color:#17324b;margin:0}header{background:#17466d;color:white;padding:22px;text-align:center}main{max-width:760px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 2px 10px #0001}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #aaa;margin:5px 0;box-sizing:border-box}input,select{width:100%}button{background:#137b66;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}small{color:#526577}.error{color:#a22}h1{margin:0}</style></head><body><header><h1>🏡 Chore-n-Score</h1><p>Every job counts · by DesK Apps</p></header><main><p id="notice" role="status"></p><section id="auth" class="card"><h2>Family sign in</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password (6+ characters)"><div class="row"><button id="signin">Sign in</button><button id="signup">Register</button></div></section><section id="app" hidden><div class="card"><div class="row"><h2>My household</h2><button id="signout">Sign out</button></div><p id="identity"></p><div id="setup"><input id="houseName" placeholder="Household name"><button id="createHouse">Create household</button></div><select id="households"></select></div><div id="workspace" hidden><div class="card"><h2>Available jobs</h2><div id="jobs"></div></div><div class="card"><h2>My jobs</h2><div id="mine"></div></div><div class="card" id="newJob" hidden><h2>Post a job</h2><input id="title" placeholder="Job title"><input id="details" placeholder="Description"><label>Reward (£)</label><input id="reward" type="number" min="0" step=".01" value="0"><label>Deadline (optional)</label><input id="due" type="datetime-local"><button id="post">Post job</button></div><div class="card" id="reviews"><h2>Awaiting my approval</h2><div id="reviewList"></div></div><div class="card"><h2>My earnings</h2><h3 id="balance">£0.00</h3><small>Virtual ledger only. No automatic bank transfers.</small></div></div></section></main><script type="module">import{createClient}from 'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://ftsdchnwfgornnfkleks.supabase.co','sb_publishable_qQuPwHzgRKAXKHJlNtP6bA_LT5DHgyG');const el=id=>document.getElementById(id);let user,house,role;const msg=(s,error=false)=>{el('notice').textContent=s;el('notice').className=error?'error':''};async function run(fn){try{await fn()}catch(e){msg(e.message,true)}}function check(r){if(r.error)throw r.error;return r.data}async function boot(){user=(await db.auth.getUser()).data.user;el('auth').hidden=!!user;el('app').hidden=!user;if(!user)return;el('identity').textContent=user.email;let memberships=check(await db.from('memberships').select('household_id,role,can_create_jobs,households(name)'));el('setup').hidden=memberships.length>0;el('households').replaceChildren(...memberships.map(m=>{let o=document.createElement('option');o.value=m.household_id;o.textContent=m.households?.name||'Household';return o}));house=memberships.find(m=>m.household_id===el('households').value)||memberships[0];el('workspace').hidden=!house;if(house){role=house.role;el('newJob').hidden=!(role==='parent'||house.can_create_jobs);await load()}}async function load(){let jobs=check(await db.from('jobs').select('*').eq('household_id',house.household_id).order('created_at',{ascending:false}));let entries=check(await db.from('wallet_entries').select('amount_pence').eq('household_id',house.household_id).eq('user_id',user.id));el('balance').textContent='£'+(entries.reduce((a,b)=>a+b.amount_pence,0)/100).toFixed(2);function render(id,items,action){let root=el(id);root.replaceChildren();if(!items.length)root.textContent='Nothing here yet.';for(let j of items){let div=document.createElement('div');div.className='card';let p=document.createElement('p');p.textContent=j.title+' · £'+(j.reward_pence/100).toFixed(2)+' · '+j.status;div.append(p);if(j.details){let s=document.createElement('small');s.textContent=j.details;div.append(s)}for(let [label,fn] of action(j)){let b=document.createElement('button');b.textContent=label;b.onclick=()=>run(async()=>{check(await fn());msg('Updated');await load()});div.append(b)}root.append(div)}}render('jobs',jobs.filter(j=>j.status==='available'&&(!j.assigned_to||j.assigned_to===user.id)),j=>[['Claim',()=>db.rpc('claim_job',{j:j.id})]]);render('mine',jobs.filter(j=>j.claimed_by===user.id&&['claimed','returned','review'].includes(j.status)),j=>['claimed','returned'].includes(j.status)?[['Submit for review',()=>db.rpc('submit_job',{j:j.id})]]:[]);render('reviewList',jobs.filter(j=>j.status==='review'&&j.claimed_by!==user.id&&(j.creator_id===user.id||role==='parent')),j=>[['Approve',()=>db.rpc('review_job',{j:j.id,approved:true})],['Return',()=>db.rpc('review_job',{j:j.id,approved:false})]])}el('signin').onclick=()=>run(async()=>{check(await db.auth.signInWithPassword({email:el('email').value,password:el('password').value}));await boot()});el('signup').onclick=()=>run(async()=>{check(await db.auth.signUp({email:el('email').value,password:el('password').value}));msg('Registration sent. Confirm your email if requested, then sign in.')});el('signout').onclick=()=>run(async()=>{check(await db.auth.signOut());await boot()});el('createHouse').onclick=()=>run(async()=>{check(await db.rpc('create_household',{n:el('houseName').value}));await boot()});el('households').onchange=()=>run(boot);el('post').onclick=()=>run(async()=>{check(await db.from('jobs').insert({household_id:house.household_id,creator_id:user.id,title:el('title').value.trim(),details:el('details').value,reward_pence:Math.round(Number(el('reward').value)*100),due_at:el('due').value?new Date(el('due').value).toISOString():null}));el('title').value='';msg('Job posted');await load()});run(boot);</script></body></html>
